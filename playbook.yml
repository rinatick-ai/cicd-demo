- hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Put index page
      ansible.builtin.copy:
        content: "Hello from Ansible\n"
        dest: /var/www/html/index.html

    - name: Nginx started and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
